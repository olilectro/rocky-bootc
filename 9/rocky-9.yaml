releasever: 9
variables:
  distro: "rocky9"

repos:
  - baseos
  - appstream

packages:
  - rocky-repos

postprocess:
  - |
    #!/usr/bin/env bash

    set -euo pipefail

    mkdir -p /usr/lib/bootc/install/
    cat > /usr/lib/bootc/install/20-rhel.toml << EOF
    [install]
    root-fs-type = "xfs"
    EOF

    # kdump needs crashkernel= kargs and a writable /boot, which this base
    # image does not provide, so it fails on boot. Derived images can opt in
    # with `systemctl enable kdump.service` plus a kargs.d crashkernel entry.
    mkdir -p /usr/lib/systemd/system-preset/
    cat > /usr/lib/systemd/system-preset/80-rocky-bootc.preset << EOF
    disable kdump.service
    EOF
  - |
    #!/usr/bin/env bash
    set -euo pipefail
    dnf clean all
    rm /var/{log,cache,lib}/* -rf
    systemctl preset-all

include:
  - standard/manifest.yaml